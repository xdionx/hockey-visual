<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NHL Scores">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NHL Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>NHL Scores</h1>
    <nav class="datebar" aria-label="Choose date">
      <button id="prev" type="button" aria-label="Previous day">&#8249;</button>
      <input id="date" type="date" aria-label="Game date">
      <button id="next" type="button" aria-label="Next day">&#8250;</button>
      <button id="today" type="button" class="today">Today</button>
    </nav>
    <div id="view" class="seg" role="group" aria-label="Layout">
      <button type="button" data-view="compact" aria-pressed="true">Compact</button>
      <button type="button" data-view="cards" aria-pressed="false">Cards</button>
    </div>
    <p id="dateLabel" class="date-label"></p>
  </header>
  <main id="games" aria-live="polite"></main>
  <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title">
    <div class="lb-head">
      <h2 id="lightbox-title"></h2>
      <a id="lightbox-nhl" href="#" target="_blank" rel="noopener">NHL.com</a>
      <button id="lightbox-close" type="button" aria-label="Close video">&times;</button>
    </div>
    <div id="lightbox-frame" class="lb-frame"></div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
